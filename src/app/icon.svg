<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70.285 70.285" fill="#0f3bff">
  <!--
    The browser-tab icon: the Ryder R, same four paths as src/components/RyderIcon.tsx.

    Two differences from the component, both forced by where this renders.
    The fill is the literal brand blue rather than currentColor, because a
    favicon has no inherited colour to pick up. And there is no background
    plate: at 16px a plate leaves the glyph too small to read, while the blue
    holds against both a light and a dark tab strip.

    Next.js picks this up from app/icon.svg automatically - no <link> tag and
    no metadata entry needed.
  -->
